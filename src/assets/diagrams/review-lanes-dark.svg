<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340">
  <g font-family="Inter Variable, system-ui, sans-serif" fill="#eceae4">
    <!-- Top banner node -->
    <rect x="20" y="16" width="640" height="64" rx="8" fill="#25252d" stroke="#3a3a43" stroke-width="1.5" />
    <text x="340" y="38" font-size="12" font-weight="700" letter-spacing="0.06em" text-anchor="middle" fill="#8a8a93">PULL REQUEST OPENED</text>
    <text x="340" y="61" font-size="15" font-weight="600" text-anchor="middle" fill="#eceae4">"Station impact" checklist declares what the change touches</text>

    <!-- Split connectors from top banner to the two lane cards -->
    <path d="M 340 80 L 340 94 L 174 94 L 174 106" fill="none" stroke="#8fa1ef" stroke-width="2" />
    <polygon points="174,110 169,102 179,102" fill="#8fa1ef" />

    <path d="M 340 80 L 340 94 L 506 94 L 506 106" fill="none" stroke="#e0654d" stroke-width="2" />
    <polygon points="506,110 501,102 511,102" fill="#e0654d" />

