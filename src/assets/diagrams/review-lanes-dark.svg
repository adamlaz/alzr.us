    <rect x="20" y="110" width="308" height="210" rx="8" fill="#1d1d24" stroke="#8fa1ef" stroke-width="2" />
    <text x="40" y="136" font-size="12" font-weight="700" letter-spacing="0.05em" fill="#8fa1ef">FAST LANE · UI &amp; FLOWS</text>
    <text x="40" y="162" font-size="18" font-weight="600" fill="#eceae4">Self-merges on green CI</text>
    <line x1="40" y1="176" x2="308" y2="176" stroke="#3a3a43" stroke-width="1" />

    <circle cx="46" cy="197" r="3.5" fill="#8fa1ef" />
    <text x="58" y="202" font-size="14" fill="#eceae4">Screens, station kit &amp; copy</text>

    <circle cx="46" cy="223" r="3.5" fill="#8fa1ef" />
    <text x="58" y="228" font-size="14" fill="#eceae4">Keyboard shortcuts &amp; pause guide</text>

    <circle cx="46" cy="249" r="3.5" fill="#8fa1ef" />
    <text x="58" y="254" font-size="14" fill="#eceae4">Interactive training &amp; QA review UI</text>

    <rect x="36" y="272" width="276" height="32" rx="6" fill="#25252d" stroke="#3a3a43" stroke-width="1" />
    <text x="174" y="293" font-size="12.5" font-weight="600" text-anchor="middle" fill="#eceae4">No approval required · ~5 min median</text>

    <!-- Right Card: Contract Lane (Seams & Gates) -->
    <rect x="352" y="110" width="308" height="210" rx="8" fill="#1d1d24" stroke="#e0654d" stroke-width="2" />
    <rect x="356" y="114" width="300" height="202" rx="5" fill="none" stroke="#e0654d" stroke-width="1" stroke-dasharray="4 3" />
    <text x="372" y="136" font-size="12" font-weight="700" letter-spacing="0.05em" fill="#f0b6a8">CONTRACT LANE · SEAMS &amp; GATES</text>
    <text x="372" y="162" font-size="18" font-weight="600" fill="#eceae4">Code owner requested</text>
    <line x1="372" y1="176" x2="640" y2="176" stroke="#3a3a43" stroke-width="1" />

    <rect x="374.5" y="193.5" width="7" height="7" rx="1.5" fill="#e0654d" />
    <text x="390" y="202" font-size="14" fill="#eceae4">Order, media, inspection &amp; Slack seams</text>

    <rect x="374.5" y="219.5" width="7" height="7" rx="1.5" fill="#e0654d" />
    <text x="390" y="228" font-size="14" fill="#eceae4">Local mock parity with production rules</text>

    <rect x="374.5" y="245.5" width="7" height="7" rx="1.5" fill="#e0654d" />
    <text x="390" y="254" font-size="14" fill="#eceae4">CI workflow &amp; PR template</text>

    <rect x="368" y="272" width="276" height="32" rx="6" fill="#3a221d" stroke="#e0654d" stroke-width="1" />
