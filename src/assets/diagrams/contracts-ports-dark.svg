<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410">
  <g font-family="Inter Variable, system-ui, sans-serif" fill="#eceae4">
    
    <text x="20" y="26" font-size="12" font-weight="700" letter-spacing="0.05em" fill="#8a8a93">PORT</text>
    <text x="200" y="26" font-size="12" font-weight="700" letter-spacing="0.05em" fill="#8a8a93">MOCK MODE (DEFAULT)</text>
    <text x="422" y="26" font-size="12" font-weight="700" letter-spacing="0.05em" fill="#8fa1ef">REAL MODE</text>
    
    <!-- Order lookup -->
    <text x="20" y="71" font-size="14.5" font-weight="700" fill="#eceae4">Order lookup</text>
    <text x="20" y="90" font-size="12.5" fill="#8a8a93">Which tapes are in this box?</text>
    <rect x="200" y="44" width="208" height="62" rx="8" fill="#25252d" stroke="#3a3a43" stroke-width="1.5" stroke-dasharray="5 3" />
    <text x="214" y="71" font-size="13" fill="#eceae4">Three sample orders, plus</text>
    <text x="214" y="90" font-size="13" fill="#eceae4">orders generated per test</text>
    <rect x="422" y="44" width="238" height="62" rx="8" fill="#1d1d24" stroke="#8fa1ef" stroke-width="2" />
    <text x="436" y="71" font-size="13.5" font-weight="600" fill="#eceae4">Order service</text>
    <text x="436" y="90" font-size="12.5" fill="#8a8a93">one GET per scan</text>

    <!-- Media locator -->
    <text x="20" y="143" font-size="14.5" font-weight="700" fill="#eceae4">Media locator</text>
    <text x="20" y="162" font-size="12.5" fill="#8a8a93">Where is each file?</text>
    <rect x="200" y="116" width="208" height="62" rx="8" fill="#25252d" stroke="#3a3a43" stroke-width="1.5" stroke-dasharray="5 3" />
    <text x="214" y="143" font-size="13" fill="#eceae4">Bundled test clips, capture</text>
    <text x="214" y="162" font-size="13" fill="#eceae4">versions in a JSON file</text>
    <rect x="422" y="116" width="238" height="62" rx="8" fill="#1d1d24" stroke="#8fa1ef" stroke-width="2" />
    <text x="436" y="143" font-size="13.5" font-weight="600" fill="#eceae4">Media service</text>
    <text x="436" y="162" font-size="12.5" fill="#8a8a93">locate per order, refresh per file</text>

    <!-- Inspection sink -->
    <text x="20" y="215" font-size="14.5" font-weight="700" fill="#eceae4">Inspection sink</text>
    <text x="20" y="234" font-size="12.5" fill="#8a8a93">Save this result.</text>
    <rect x="200" y="188" width="208" height="62" rx="8" fill="#25252d" stroke="#3a3a43" stroke-width="1.5" stroke-dasharray="5 3" />
    <text x="214" y="215" font-size="13" fill="#eceae4">Append-only file; refuses</text>
    <text x="214" y="234" font-size="13" fill="#eceae4">what production refuses</text>
    <rect x="422" y="188" width="238" height="62" rx="8" fill="#1d1d24" stroke="#8fa1ef" stroke-width="2" />
    <text x="436" y="215" font-size="13.5" font-weight="600" fill="#eceae4">Inspection API</text>
    <text x="436" y="234" font-size="12.5" fill="#8a8a93">POST, deduplicated by event ID</text>

    <!-- Inspection reader -->
    <text x="20" y="287" font-size="14.5" font-weight="700" fill="#eceae4">Inspection reader</text>
    <text x="20" y="306" font-size="12.5" fill="#8a8a93">What has any station saved?</text>
    <rect x="200" y="260" width="208" height="62" rx="8" fill="#25252d" stroke="#3a3a43" stroke-width="1.5" stroke-dasharray="5 3" />
    <text x="214" y="296" font-size="13" fill="#eceae4">Reads the same file back</text>
    <rect x="422" y="260" width="238" height="62" rx="8" fill="#1d1d24" stroke="#8fa1ef" stroke-width="2" />
    <text x="436" y="287" font-size="13.5" font-weight="600" fill="#eceae4">Inspection API</text>
    <text x="436" y="306" font-size="12.5" fill="#8a8a93">GET, read back by order</text>

    <!-- Notify sink -->
    <text x="20" y="359" font-size="14.5" font-weight="700" fill="#eceae4">Notify sink</text>
    <text x="20" y="378" font-size="12.5" fill="#8a8a93">Post the order summary.</text>
    <rect x="200" y="332" width="208" height="62" rx="8" fill="#25252d" stroke="#3a3a43" stroke-width="1.5" stroke-dasharray="5 3" />
    <text x="214" y="368" font-size="13" fill="#eceae4">Appends to a log file</text>
    <rect x="422" y="332" width="238" height="62" rx="8" fill="#1d1d24" stroke="#8fa1ef" stroke-width="2" />
    <text x="436" y="359" font-size="13.5" font-weight="600" fill="#eceae4">Slack</text>
    <text x="436" y="378" font-size="12.5" fill="#8a8a93">one message per finished round</text>
  </g>
</svg>
