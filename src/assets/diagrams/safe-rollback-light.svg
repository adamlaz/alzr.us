<svg xmlns="http://www.w3.org/2000/svg" width="400" height="548" viewBox="0 0 400 548">
<g font-family="Inter Variable, system-ui, sans-serif" font-size="18" fill="#1c1d24">

<text x="200" y="25" text-anchor="middle" font-size="16" letter-spacing="1">WITH CODEX CLOSED</text>
<rect x="24" y="48" width="352" height="78" rx="8" fill="#ffffff" stroke="#cfcfd1"/>
<text x="200" y="80" text-anchor="middle" font-weight="600">Compare the current file</text>
<text x="200" y="107" text-anchor="middle">with its installed digest</text>
<path d="M200 126 V158 H24 V412" fill="none" stroke="#8a8a90" stroke-width="2"/>
<path d="M24 214 H52 m-6 -4 6 4 -6 4" fill="none" stroke="#2f3eb0" stroke-width="2"/>
<rect x="60" y="174" width="316" height="116" rx="8" fill="#2f3eb0"/>
<g fill="#ffffff">
<text x="80" y="205" font-size="16" letter-spacing="1">MATCH</text>
<text x="80" y="239" font-size="21" font-weight="600">Restore the backup</text>
<text x="80" y="268" >No later edits to overwrite</text>
</g>
<path d="M24 412 H52 m-6 -4 6 4 -6 4" fill="none" stroke="#8a8a90" stroke-width="2"/>
<rect x="60" y="334" width="316" height="186" rx="8" fill="#f1f0ec" stroke="#cfcfd1"/>
<text x="80" y="365" font-size="16" letter-spacing="0.6">CHANGED OR UNKNOWN</text>
<text x="80" y="400" font-size="21" font-weight="600">Keep the current file</text>
<text x="80" y="432" >Report the conflict.</text>
<text x="80" y="463" >A missing digest also</text>
<text x="80" y="489" >stops the restore.</text>
</g>
</svg>
