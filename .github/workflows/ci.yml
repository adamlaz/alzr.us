name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Biome lint + format
        run: npx @biomejs/biome check .
      - name: Astro type check
        run: npx astro check
      - name: Astro build
        run: npm run build
